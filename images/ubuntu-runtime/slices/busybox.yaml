# Busybox slice for the ContainerHive chisel build backend.
# Upstream base: canonical/chisel-releases (slices/busybox.yaml).
# One symlink per busybox applet, so the cut installs the applets
# like the old post-cut `busybox --install` instruction. Applet
# paths that another release package declares keep their alternate
# /bin or /sbin spelling, which resolves to the same physical file
# through the usrmerge symlinks. The essential blocks are omitted:
# the cut spec lists the needed slices, and the block form differs
# between release formats.
# Regenerate with tools/enumerate-applets.sh.

package: busybox

slices:
  bins:
    contents:
      /usr/bin/busybox:
      /bin/[: {symlink: /usr/bin/busybox}
      /bin/[[: {symlink: /usr/bin/busybox}
