description: Ubuntu runtime base image with minimal dependencies and no package manager
build: chisel

tags:
  - name: "24.04"
    versions:
      ubuntu: "24.04"
  - name: "26.04"
    versions:
      ubuntu: "26.04"

chisel:
  chisel_version: "v1.5.1" # renovate: datasource=github-releases depName=canonical/chisel

config:
  env:
    HOME: /home/runtime
  user: "1000:1000"

report:
  icon: devicon-ubuntu-plain

variants:
  - name: bash
    tag_suffix: "-bash"
    chisel:
      parent: "__hive_parent__"

latest_alias:
  tag: edge
  on_missing: warning
